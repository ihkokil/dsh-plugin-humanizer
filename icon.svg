<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#3b82f6"/>
  
  <!-- Text lines representing original (robotic) text -->
  <rect x="16" y="18" width="32" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="16" y="26" width="28" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="16" y="34" width="24" height="4" rx="2" fill="white" opacity="0.3"/>
  
  <!-- Arrow showing transformation -->
  <path d="M32 40 L32 50" stroke="white" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white"/>
    </marker>
  </defs>
  
  <!-- Text lines representing humanized text (more varied) -->
  <rect x="18" y="52" width="26" height="3" rx="1.5" fill="white"/>
  <rect x="16" y="57" width="30" height="3" rx="1.5" fill="white"/>
  <rect x="20" y="62" width="18" height="3" rx="1.5" fill="white"/>
</svg>